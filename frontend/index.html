<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosecha — Plataforma de Tutorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="citrico">
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="fruit" id="brandFruit">🍊</span>
      <div>
        <h1>Cosecha</h1>
        <span>Plataforma de tutorías</span>
      </div>
    </div>
    <div class="controls" id="topControls" style="display:none;">
      <select id="themeSelect">
        <option value="citrico">Tema Cítrico 🍊</option>
        <option value="pina">Tema Piña 🍍</option>
      </select>
      <span class="tag mat" id="roleTag"></span>
      <button class="ghost" id="switchRoleBtn">Cambiar de rol</button>
    </div>
  </div>

  <div id="roleSelectScreen" class="role-select">
    <div class="role-card" onclick="App.enterRole('docente')">
      <span class="emoji">🧑‍🏫</span>
      <h3>Soy Docente</h3>
      <p>Crear ejercicios, asignar tareas y ver el progreso.</p>
    </div>
    <div class="role-card" onclick="App.enterRole('estudiante')">
      <span class="emoji">🧒</span>
      <h3>Soy Estudiante</h3>
      <p>Resolver ejercicios y vestir a mi personaje.</p>
    </div>
  </div>

  <div id="navBar" class="modnav" style="display:none;"></div>
  <div id="appScreen" style="display:none;"></div>

  <footer class="note">Prototipo de demostración · datos servidos por API REST (backend) simulando Firestore.</footer>
</div>

<script src="js/api.js"></script>
<script src="js/personaje.js"></script>
<script src="js/app.js"></script>
</body>
</html>
